# IINA input config — hybrid of VLC (Windows) + YouTube web player controls
# Generated for IINA (this is NOT a VLC file — VLC doesn't use text keymaps)

#@iina Ctrl+p toggle-pip
#@iina r show-current-file-in-finder
#@iina i toggle-music-mode

# ---- Playback ----
SPACE cycle pause
k cycle pause
f cycle fullscreen
ESC set fullscreen no
s stop

# ---- Seeking ----
# YouTube arrows: 5s | J/L: 10s | Shift: 3s (VLC "very short")
LEFT seek -5
RIGHT seek 5
j seek -10
l seek 10
Shift+LEFT seek -3
Shift+RIGHT seek 3
# VLC jump tiers
Alt+LEFT seek -10
Alt+RIGHT seek 10
Ctrl+LEFT seek -60
Ctrl+RIGHT seek 60
Ctrl+Alt+LEFT seek -300
Ctrl+Alt+RIGHT seek 300
# mac-native equivalents (kept from original)
Alt+Meta+LEFT seek -10
Alt+Meta+RIGHT seek 10
Shift+Meta+LEFT seek -60
Shift+Meta+RIGHT seek 60
Shift+Alt+Meta+LEFT seek -300
Shift+Alt+Meta+RIGHT seek 300
# YouTube percent-seek
0 seek 0 absolute-percent
1 seek 10 absolute-percent
2 seek 20 absolute-percent
3 seek 30 absolute-percent
4 seek 40 absolute-percent
5 seek 50 absolute-percent
6 seek 60 absolute-percent
7 seek 70 absolute-percent
8 seek 80 absolute-percent
9 seek 90 absolute-percent

# ---- Volume ----
UP add volume 5
DOWN add volume -5
VOLUME_UP add volume 2
VOLUME_DOWN add volume -2
m cycle mute
MUTE cycle mute
Alt+Meta+DOWN cycle mute

# ---- Playlist / chapters ----
n playlist-next
p playlist-prev
Meta+RIGHT playlist-next
Meta+LEFT playlist-prev
Meta+z playlist-shuffle
Ctrl+d add chapter 1
Ctrl+u add chapter -1

# ---- Frame step ----
, frame-back-step
. frame-step
e frame-step

# ---- Speed ----
[ add speed -0.1
] add speed 0.1
< add speed -0.25
> add speed 0.25
= set speed 1.0
Meta+= multiply speed 1.5
Meta+- multiply speed 0.5

# ---- Subtitles & audio ----
v cycle sub
b cycle audio
c cycle-values sub-visibility yes no
S cycle sub-visibility
Shift+j add sub-delay 0.1
Shift+h add sub-delay -0.1
Shift+g add audio-delay 0.1
Shift+f add audio-delay -0.1
d cycle deinterlace
Meta+L ab-loop
Meta+l cycle-values loop "inf" "no"

# ---- Video / window ----
Meta+0 set window-scale 0.5
Meta+1 set window-scale 1
Meta+2 set window-scale 2
z cycle-values window-scale 0.25 0.5 1 2
Z cycle-values window-scale 2 1 0.5 0.25
a cycle-values video-aspect-override "-1" "16:9" "4:3" "1:1" "16:10" "2.21:1" "2.35:1" "2.39:1" "5:4"
Alt+Meta+s screenshot

# ---- Media keys ----
POWER quit
PLAY cycle pause
PAUSE cycle pause
PLAYPAUSE cycle pause
PLAYONLY set pause no
PAUSEONLY set pause yes
STOP stop
FORWARD seek 60
REWIND seek -60
NEXT playlist-next
PREV playlist-prev
CLOSE_WIN quit
#@iina BS delete-current-file
